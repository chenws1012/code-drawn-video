<!doctype html>
<!-- index.html —— p5 渲染宿主（调度器）。章节代码只注册 window.__ch[N].draw(t)，
     宿主负责：铺底色 → 调章节 → 纸纹 → 错误捕获（__err 供渲染器轮询）。
     RES=2 即 2x 超采样出 1440p：章节代码保持 1280×720 逻辑坐标不变。 -->
<html>
<head>
  <meta charset="utf-8" />
  <title>code-drawn video host</title>
  <style>
    html, body { margin: 0; background: #333; }
    /* 可选手写字体（放 fonts/ 目录，缺失自动回退）：
    @font-face { font-family:'LXGW WenKai'; src:url('fonts/LXGWWenKai-Regular.ttf') format('truetype'); } */
  </style>
</head>
<body>
  <script src="lib/p5.min.js"></script>
  <script src="shared/style.js"></script>
  <!-- 按章节数增减 -->
  <script src="chapters/ch1.js"></script>
  <script src="chapters/ch2.js"></script>
  <script>
    const RES = 2;                 // 1=720p, 2=1440p, 3=4K
    window.__ch = window.__ch || {};
    window.__t = 0;
    window.__err = null;
    window.__chFrames = 240;
    let __CH = 1;
    window.__set = function (ch, t, frames) { __CH = ch; window.__t = t; if (frames) window.__chFrames = frames; };

    function setup() {
      createCanvas(1280 * RES, 720 * RES);
      pixelDensity(1);
      noiseSeed(42);
      randomSeed(42);
      noLoop();
      (document.fonts ? document.fonts.ready : Promise.resolve())
        .then(() => { window.__ready = true; });
    }

    function draw() {
      window.__err = null;
      push();
      scale(RES);
      background(MV.col(MV.PAPER));
      const ch = window.__ch[__CH];
      if (!ch) { window.__err = 'chapter ' + __CH + ' not registered'; pop(); return; }
      try {
        ch.draw(window.__t);
      } catch (e) {
        window.__err = (e && e.toString) ? e.toString() : String(e);
        pop();
        return;
      }
      MV.grain();
      pop();
    }
  </script>
</body>
</html>
